name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.8"

      - name: Install Python dependencies
        run: python -m pip install -r apps/filemgr/requirements.txt

      - name: Validate Python
        run: python -m py_compile apps/filemgr/app.py qt/kiosk_qt.py

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate Matter JavaScript
        run: node --check apps/matter-workstation/src/index.mjs

      - name: Validate shell scripts
        run: bash -n deploy/*.sh deploy/scripts/*.sh scripts/*.sh

      - name: Check private runtime files
        shell: bash
        run: |
          forbidden=(
            apps/filemgr/users.json
            apps/filemgr/devices.json
            apps/filemgr/tokens.json
            apps/filemgr/secret.key
            apps/filemgr/bootstrap-admin.txt
            miniapp/project.private.config.json
            apps/project.private.config.json
          )
          for path in "${forbidden[@]}"; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              echo "Private runtime file is tracked: $path" >&2
              exit 1
            fi
          done

      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
